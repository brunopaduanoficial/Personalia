<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal AI | Área do Atleta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff88; --burn: #ff4757; --bg: #050505; --card: #121212; --text: #ffffff; --dim: #888888; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; overflow-x: hidden; }

        /* TELA DE LOGIN / LICENÇA */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: var(--card); padding: 35px; border-radius: 30px; border: 1px solid #333; text-align: center; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .login-card h1 { font-size: 1.8rem; margin: 0 0 5px; color: var(--primary); font-weight: 900; letter-spacing: -1px; }
        .login-card p { font-size: 0.75rem; color: var(--dim); margin-bottom: 25px; }
        .input-field { width: 100%; background: #000; border: 1px solid #333; color: #fff; font-size: 1rem; padding: 16px; border-radius: 12px; margin-bottom: 12px; outline: none; transition: 0.3s; text-align: center; }
        .input-field:focus { border-color: var(--primary); }
        .btn-access { width: 100%; background: var(--primary); color: #000; border: none; padding: 18px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 1rem; text-transform: uppercase; margin-top: 10px; }
        #error-msg { color: var(--burn); font-size: 0.75rem; margin-top: 15px; font-weight: 600; display: none; line-height: 1.4; }

        /* INTERFACE DO APP */
        #app-interface { display: none; padding: 25px 20px 160px; max-width: 500px; margin: 0 auto; }
        .header-day { margin-bottom: 25px; border-left: 5px solid var(--primary); padding-left: 15px; }
        .day-text { color: var(--primary); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 2px; }
        .workout-title { font-size: 1.8rem; font-weight: 900; margin: 5px 0; }
        .user-badge { font-size: 0.65rem; color: var(--dim); display: block; margin-top: 5px; opacity: 0.7; }

        /* TABS DE OBJETIVO */
        .tabs { display: flex; background: #1a1a1a; padding: 5px; border-radius: 15px; margin-bottom: 25px; gap: 5px; overflow-x: auto; scrollbar-width: none; }
        .tab { flex: 1; border: none; background: none; color: var(--dim); padding: 12px; font-weight: 700; cursor: pointer; font-size: 0.65rem; border-radius: 10px; white-space: nowrap; transition: 0.3s; }
        .tab.active { background: var(--primary); color: #000; box-shadow: 0 4px 15px rgba(0,255,136,0.3); }

        /* MODO QUEIMA (RED DESIGN) */
        .burn-mode .tab.active { background: var(--burn); color: #fff; }
        .burn-mode .header-day { border-left-color: var(--burn); }
        .burn-mode .day-text, .burn-mode .reps-badge, .burn-mode #timer-num, .burn-mode .sug-kg { color: var(--burn) !important; }
        .burn-mode .btn-timer { background: var(--burn); color: #fff; }

        /* CARDS EXERCICIOS */
        .card { background: var(--card); border-radius: 22px; padding: 20px; margin-bottom: 15px; border: 1px solid #222; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .ex-info b { font-size: 1.1rem; display: block; color: #fff; }
        .ex-info small { color: var(--dim); font-size: 0.75rem; }
        .reps-badge { background: #1a1a1a; color: var(--primary); padding: 6px 12px; border-radius: 10px; font-weight: 800; font-size: 0.75rem; border: 1px solid #333; }

        .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; border-top: 1px solid #222; padding-top: 15px; }
        .input-group label { display: block; font-size: 0.6rem; color: var(--dim); text-transform: uppercase; margin-bottom: 5px; font-weight: 700; }
        .sug-kg { color: var(--primary); font-weight: 900; font-size: 1.1rem; }
        .kg-input { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 10px; text-align: center; font-weight: 800; font-size: 1rem; outline: none; }
        .kg-input:focus { border-color: #555; }

        /* DOCK FIXO */
        .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; background: rgba(18,18,18,0.9); backdrop-filter: blur(15px); padding: 15px 25px; border-radius: 25px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 999; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        #timer-num { font-size: 2.2rem; font-weight: 900; color: var(--primary); font-variant-numeric: tabular-nums; }
        .btn-timer { background: var(--primary); color: #000; border: none; padding: 14px 24px; border-radius: 15px; font-weight: 900; cursor: pointer; font-size: 0.9rem; }

        /* CARDIO BOX */
        .cardio-box { background: linear-gradient(145deg, #1a1a1a, #0a0a0a); padding: 20px; border-radius: 20px; border: 1px dashed #444; margin: 20px 0 40px; }
    </style>
</head>
<body id="main-body">

    <div id="login-screen">
        <div class="login-card">
            <h1>PERSONAL AI</h1>
            <p>Área de Treinamento Exclusiva</p>
            
            <input type="email" id="user-email" class="input-field" placeholder="E-mail do Aluno" spellcheck="false">
            <input type="password" id="user-pin" class="input-field" placeholder="PIN de 4 dígitos" maxlength="4">
            
            <button class="btn-access" onclick="validarAcesso()">ATIVAR TREINO</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <div id="app-interface">
        <header class="header-day">
            <div id="label-dia" class="day-text">--</div>
            <div id="label-treino" class="workout-title">--</div>
            <span id="user-name" class="user-badge"></span>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="setGoal('forte', this)">FORTE</button>
            <button class="tab" onclick="setGoal('medio', this)">MÉDIO</button>
            <button class="tab" onclick="setGoal('definir', this)">DEFINIR</button>
            <button class="tab" onclick="setGoal('perder', this)">EMAGRECER</button>
        </div>

        <div id="exercise-feed"></div>
        <div id="cardio-feed"></div>

        <div class="dock">
            <div>
                <small style="font-size: 0.6rem; color: var(--dim); display: block; font-weight: 800; text-transform: uppercase;">Descanso</small>
                <span id="timer-num">01:00</span>
            </div>
            <button class="btn-timer" onclick="startTimer()">PAUSA</button>
        </div>
    </div>

<script>
    /* ==========================================================
       BANCO DE DADOS DE CLIENTES (ADICIONE NOVOS AQUI)
       ========================================================== */
    const DATABASE_CLIENTES = {
        'voce@email.com': { pin: '1234', nome: 'Atleta Master', exp: '2027-01-01' },
        'bruno@gmail.com': { pin: '1122', nome: 'Bruno', exp: '2026-03-19' }
    };
        'cliente1@gmail.com': { pin: '1122', nome: 'João Silva', exp: '2026-12-31' }
    };
    /* ========================================================== */

    let currentGoal = 'forte';
    let timerOn = false;

    // Gerador de DNA Anti-Pirataria
    function getDeviceDNA() {
        return btoa(navigator.userAgent + screen.width + screen.height + navigator.language);
    }

    function validarAcesso() {
        const email = document.getElementById('user-email').value.toLowerCase().trim();
        const pin = document.getElementById('user-pin').value;
        const erro = document.getElementById('error-msg');
        const dnaAtual = getDeviceDNA();

        const cliente = DATABASE_CLIENTES[email];

        // 1. Validar Credenciais
        if (!cliente || cliente.pin !== pin) {
            erro.innerHTML = "ACESSO NEGADO!<br>Verifique seu E-mail e PIN.";
            erro.style.display = "block";
            return;
        }

        // 2. Validar Expiração
        if (new Date().toISOString().split('T')[0] > cliente.exp) {
            erro.innerHTML = "LICENÇA EXPIRADA!<br>Renove seu plano com o treinador.";
            erro.style.display = "block";
            return;
        }

        // 3. TRAVA DE DNA (Anti-Compartilhamento)
        const chaveDna = 'dna_' + btoa(email);
        const dnaRegistrado = localStorage.getItem(chaveDna);

        if (!dnaRegistrado) {
            localStorage.setItem(chaveDna, dnaAtual);
            alert("Dispositivo Registrado com Sucesso!");
        } else if (dnaRegistrado !== dnaAtual) {
            erro.innerHTML = "ERRO DE SEGURANÇA!<br>Esta conta está vinculada a outro aparelho.";
            erro.style.display = "block";
            return;
        }

        // 4. Sucesso total
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-interface').style.display = 'block';
        document.getElementById('user-name').innerText = "ATLETA: " + cliente.nome;
        render();
    }

    const dbTreinos = {
        'Segunda': { titulo: 'Peito e Tríceps', ex: [
            {id:'s1', n:'Supino Reto', m:'Barra Olímpica', r:40, reps:{forte:'4x8', medio:'3x12', definir:'3x15', perder:'4x20'}},
            {id:'s2', n:'Supino Inclinado', m:'Halteres', r:30, reps:{forte:'4x10', medio:'3x12', definir:'3x15', perder:'4x20'}},
            {id:'s3', n:'Voador (Peck Deck)', m:'Máquina', r:35, reps:{forte:'3x12', medio:'3x15', definir:'4x15', perder:'4x25'}},
            {id:'s4', n:'Tríceps Corda', m:'Polia Alta', r:20, reps:{forte:'4x10', medio:'3x12', definir:'3x15', perder:'4x20'}},
            {id:'s5', n:'Tríceps Testa', m:'Barra W', r:15, reps:{forte:'3x10', medio:'3x12', definir:'3x15', perder:'4x20'}}
        ]},
        'Terça': { titulo: 'Costas e Bíceps', ex: [
            {id:'t1', n:'Puxada Alta', m:'Pulley', r:45, reps:{forte:'4x8', medio:'3x12', definir:'3x15', perder:'4x20'}},
            {id:'t2', n:'Remada Curvada', m:'Barra', r:35, reps:{forte:'4x10', medio:'3x12', definir:'3x15', perder:'4x20'}},
            {id:'t3', n:'Remada Baixa', m:'Triângulo', r:40, reps:{forte:'3x12', medio:'3x15', definir:'4x15', perder:'4x25'}},
            {id:'t4', n:'Rosca Direta', m:'Barra W', r:12, reps:{forte:'4x10', medio:'3x12', definir:'3x15', perder:'4x20'}},
            {id:'t5', n:'Rosca Martelo', m:'Halteres', r:10, reps:{forte:'3x12', medio:'3x12', definir:'3x15', perder:'4x20'}}
        ]},
        'Quarta': { titulo: 'Perna Completo', ex: [
            {id:'q1', n:'Agachamento Livre', m:'Barra', r:50, reps:{forte:'4x8', medio:'3x12', definir:'3x15', perder:'4x20'}},
            {id:'q2', n:'Leg Press 45', m:'Máquina', r:120, reps:{forte:'4x10', medio:'4x12', definir:'4x15', perder:'4x20'}},
            {id:'q3', n:'Cadeira Extensora', m:'Máquina', r:35, reps:{forte:'3x12', medio:'3x15', definir:'4x15', perder:'4x25'}},
            {id:'q4', n:'Mesa Flexora', m:'Máquina', r:25, reps:{forte:'3x12', medio:'3x15', definir:'4x15', perder:'4x20'}},
            {id:'q5', n:'Panturrilha em Pé', m:'Máquina/Solo', r:40, reps:{forte:'4x15', medio:'4x20', definir:'4x25', perder:'4x30'}}
        ]},
        'Quinta': { titulo: 'Ombros e Trapézio', ex: [
            {id:'qi1', n:'Desenvolvimento', m:'Halteres', r:15, reps:{forte:'4x8', medio:'3x12', definir:'3x15', perder:'4x20'}},
            {id:'qi2', n:'Elevação Lateral', m:'Halteres', r:10, reps:{forte:'4x12', medio:'3x15', definir:'4x15', perder:'4x25'}},
            {id:'qi3', n:'Elevação Frontal', m:'Polia/Halter', r:10, reps:{forte:'3x12', medio:'3x12', definir:'3x15', perder:'4x20'}},
            {id:'qi4', n:'Encolhimento', m:'Barra/Halter', r:50, reps:{forte:'4x12', medio:'4x15', definir:'4x15', perder:'4x20'}}
        ]},
        'Sexta': { titulo: 'Core Metabólico', ex: [
            {id:'sx1', n:'Afundo', m:'Halteres', r:15, reps:{forte:'3x10', medio:'3x12', definir:'4x15', perder:'4x20'}},
            {id:'sx2', n:'Flexão de Braço', m:'Solo', r:0, reps:{forte:'4x Máx', medio:'3x15', definir:'4x20', perder:'4x25'}},
            {id:'sx3', n:'Abdominal Infra', m:'Solo', r:0, reps:{forte:'3x20', medio:'4x25', definir:'4x30', perder:'5x30'}},
            {id:'sx4', n:'Prancha Isométrica', m:'Solo', r:0, reps:{forte:'3x1min', medio:'3x45s', definir:'4x1min', perder:'5x1min'}},
            {id:'sx5', n:'Burpees', m:'Solo', r:0, reps:{forte:'3x10', medio:'3x12', definir:'4x15', perder:'5x20'}}
        ]}
    };

    function setGoal(goal, btn) {
        currentGoal = goal;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('main-body').className = (goal === 'perder' ? 'burn-mode' : '');
        render();
    }

    function render() {
        const dias = ['Segunda', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Segunda'];
        const hoje = dias[new Date().getDay()];
        const dados = dbTreinos[hoje];
        const timers = { forte:'02:00', medio:'01:00', definir:'00:45', perder:'00:30' };

        document.getElementById('label-dia').innerText = hoje + "-feira";
        document.getElementById('label-treino').innerText = dados.titulo;
        document.getElementById('timer-num').innerText = timers[currentGoal];

        const email = document.getElementById('user-email').value;

        document.getElementById('exercise-feed').innerHTML = dados.ex.map(item => {
            const mult = { forte:1, medio:0.75, definir:0.6, perder:0.5 };
            const sug = item.r === 0 ? "Peso do Corpo" : Math.round(item.r * mult[currentGoal]) + " KG";
            const storageKey = `kg_${btoa(email)}_${item.id}`;
            const salvo = localStorage.getItem(storageKey) || '';

            return `
            <div class="card">
                <div class="card-top">
                    <div class="ex-info"><b>${item.n}</b><small>📍 ${item.m}</small></div>
                    <div class="reps-badge">${item.reps[currentGoal]}</div>
                </div>
                <div class="inputs">
                    <div class="input-group">
                        <label>Sugestão AI</label>
                        <span class="sug-kg">${sug}</span>
                    </div>
                    <div class="input-group">
                        <label>Carga Atual</label>
                        <input type="number" class="kg-input" value="${salvo}" placeholder="--" 
                        onchange="localStorage.setItem('${storageKey}', this.value)">
                    </div>
                </div>
            </div>`;
        }).join('');

        document.getElementById('cardio-feed').innerHTML = `
            <div class="cardio-box">
                <b style="color:var(--primary); font-size:0.8rem; text-transform:uppercase;">🏃 Finalizador Cardio (30 min)</b>
                <p style="font-size:0.75rem; color:#888; margin-top:8px; line-height:1.5;">
                    ${currentGoal === 'perder' ? '<b>HIIT:</b> 1 min Corrida Intensa / 30 seg Descanso Parado. Repita 20x.' : '<b>LISS:</b> Caminhada rápida constante em inclinação moderada (Esteira ou Bike).'}
                </p>
            </div>`;
    }

    function startTimer() {
        if (timerOn) return;
        timerOn = true;
        let disp = document.getElementById('timer-num');
        let total = parseInt(disp.innerText.split(':')[0])*60 + parseInt(disp.innerText.split(':')[1]);
        
        const interval = setInterval(() => {
            total--;
            let m = Math.floor(total/60), s = total%60;
            disp.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if(total <= 0) {
                clearInterval(interval);
                timerOn = false;
                alert("Tempo esgotado! Inicie a próxima série.");
                render();
            }
        }, 1000);
    }
</script>
</body>
</html>
